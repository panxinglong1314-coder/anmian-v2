events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 统一单页应用（营销首页 + 登录 + 产品 + 法律页），由 nginx 直接托管 web_dist。
    server {
        listen 443 ssl;
        server_name sleepai.chat www.sleepai.chat;

        ssl_certificate /etc/letsencrypt/live/sleepai.chat/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sleepai.chat/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;

        # SPA 构建产物作为站点根目录
        root /home/ubuntu/anmian/web_dist;
        index index.html;

        # AI 爬虫可读内容
        location = /llms.txt {
            alias /home/ubuntu/anmian/web_dist/llms.txt;
            add_header Cache-Control "public, max-age=2592000";
            add_header Content-Type "text/plain; charset=utf-8";
        }
        location = /robots.txt {
            alias /home/ubuntu/anmian/web_dist/robots.txt;
            add_header Cache-Control "public, max-age=86400";
        }
        location = /sitemap.xml {
            alias /home/ubuntu/anmian/web_dist/sitemap.xml;
            add_header Cache-Control "public, max-age=86400";
        }

        # 带哈希的构建资源 —— 永久缓存
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 后台管理（后端托管）
        location /admin/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
        }

        # 静态资源（头像、白噪音等，nginx 直出）
        location /static/ {
            alias /home/ubuntu/anmian/static/;
            autoindex off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # 后端 API（含 ASR WebSocket）
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
        }

        # SPA：所有其它路径回退到 index.html（/、/login、/app、/privacy、/terms、/contact …）
        location / {
            try_files $uri $uri/ /index.html;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            # 允许同源使用麦克风（语音输入），其余禁用
            add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        }
    }

    # HTTP → HTTPS 重定向（apex → www）
    server {
        listen 80;
        server_name sleepai.chat;
        return 301 https://www.sleepai.chat$request_uri;
    }

    # HTTP → HTTPS 重定向（www）
    server {
        listen 80;
        server_name www.sleepai.chat;
        return 301 https://www.sleepai.chat$request_uri;
    }
}
